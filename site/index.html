<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servidor web com Docker | Redes de Computadores</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      color: #edf5ff;
      background: #08111e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 85% 15%, #12365b, transparent 55%),
                  #08111e;
    }

    main {
      width: min(100%, 960px);
      padding: clamp(24px, 5vw, 56px);
      border: 1px solid #294461;
      border-radius: 28px;
      background: #101d2e;
      box-shadow: 0 24px 72px #0005;
    }

    header, .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }

    .disciplina {
      margin: 0;
      color: #abc4df;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    #versao {
      flex-shrink: 0;
      margin: 0;
      padding: 7px 13px;
      border: 1px solid #346b64;
      border-radius: 999px;
      background: #143b3a;
      color: #a4f1da;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .hero { margin: 42px 0 36px; }

    h1 {
      margin: 0;
      max-width: 10ch;
      font-size: clamp(2.6rem, 7vw, 5rem);
      line-height: 0.98;
      letter-spacing: -0.065em;
    }

    h1 span { color: #7dcaff; }

    .descricao {
      max-width: 44ch;
      margin: 20px 0 0;
      color: #b8cbe0;
      line-height: 1.65;
    }

    .container {
      flex: 0 0 clamp(120px, 24vw, 225px);
      aspect-ratio: 1.25;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12%;
      padding: 6%;
      border: 2px solid #5296cb;
      border-radius: 18px;
      background: linear-gradient(145deg, #173f66, #102740);
      box-shadow: 9px 9px 0 #0b1524, 9px 9px 0 1px #294461;
    }

    .container span {
      border: 1px solid #519ee1;
      border-radius: 5px;
      background: linear-gradient(#67baff, #22578d);
    }

    dl {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 18px;
      margin: 0 0 28px;
      padding: 22px;
      border: 1px solid #294461;
      border-radius: 16px;
      background: #0b1625;
    }

    dt {
      margin-bottom: 6px;
      color: #abc4df;
      font-size: 0.82rem;
    }

    dd {
      margin: 0;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    a {
      display: inline-block;
      padding: 12px 17px;
      border-radius: 10px;
      background: #7dcaff;
      color: #081426;
      font-weight: 750;
      text-decoration: none;
    }

    a:hover { background: #acdfff; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }

    @media (max-width: 640px) {
      .container { display: none; }
      dl { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="disciplina">Redes de Computadores 2</p>
      <p id="versao">Versão 2</p>
    </header>

    <section class="hero" aria-labelledby="titulo">
      <div>
        <h1 id="titulo">Servidor web com <span>Docker</span></h1>
        <p class="descricao">
          Uma atividade prática com Nginx, bind mounts e persistência de logs.
        </p>
      </div>

      <div class="container" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </section>

    <dl>
      <div>
        <dt>Aluno</dt>
        <dd>Mateus Afonso Miranda de Oliveira</dd>
      </div>
      <div>
        <dt>Matrícula</dt>
        <dd>20231003300546</dd>
      </div>
      <div>
        <dt>Turma</dt>
        <dd>CIC1001 A03</dd>
      </div>
    </dl>

    <a href="/sobre.html">Sobre os volumes <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
